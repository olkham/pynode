name: CI

on:
  push:
  pull_request:
  # Weekly run against the latest releases of every dependency: upstream
  # removals (e.g. supervision 0.31 dropping sv.ByteTrack) surface here
  # instead of in a user's install.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - 3.11
          - 3.12

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  # The core job installs no ML packages, so every Supervision / tracker /
  # Re-ID test is skipped there (pytest.importorskip). This job installs the
  # CPU builds so those nodes are actually exercised.
  test-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with vision, reid and mqtt extras
        run: pip install -e ".[dev,reid,mqtt]"

      - name: Show resolved versions
        run: pip list | grep -i -E "supervision|trackers|reid|torch|ultralytics|numpy|opencv|paho"

      - name: Run tests (deprecations from our own code are errors)
        run: pytest -q -W "error::DeprecationWarning:pynode"

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and pyright
        run: pip install -e .[dev] pyright

      - name: Run pyright
        run: pyright
